name: PR size

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  pr-size:
    name: pr-size
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      # Full history, so the diff runs from the merge base
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Count changed lines
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          IS_LARGE_PR: ${{ contains(github.event.pull_request.labels.*.name, 'large-pr') }}
        run: tools/check-pr-size.sh
