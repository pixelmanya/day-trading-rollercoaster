name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  pr-title:
    name: pr-title
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check Conventional Commit format
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|refactor|test|docs|style|chore|ci|build|perf)(\([a-z0-9-]+\))?!?: [a-z].*[^.]$'
          if [[ "$TITLE" =~ $pattern ]]; then
            echo "OK: $TITLE"
          else
            echo "::error::PR title must be a Conventional Commit, e.g. 'feat: add JSON export' (lowercase summary, no trailing period). Got: $TITLE"
            exit 1
          fi
