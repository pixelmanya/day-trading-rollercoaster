# Render blueprint: the production web service, plus a preview of it for every pull request.
# Connect once in the Render dashboard: New → Blueprint → this repository.
services:
  - type: web
    name: day-trading-rollercoaster
    runtime: node
    # Free instances sleep when idle; the first request after a pause takes a few seconds
    plan: free
    region: frankfurt
    # pnpm comes from the packageManager field in package.json, via corepack
    # Migrations run before the build, against this deploy's own database (previews: the preview
    # branch). They must be backwards compatible: the old version keeps serving until the new one
    # is live
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm db:migrate && pnpm build
    startCommand: pnpm start
    # / stays up in guest mode even when the database is down; /api/health reports the database
    healthCheckPath: /
    # Deploy main only after its CI checks pass
    autoDeployTrigger: checksPass
    # A separate, temporary copy of this service for each pull request, with its own URL
    previews:
      generation: automatic
    envVars:
      - key: NODE_VERSION
        value: '22'
      # Secret: set in the dashboard, never here. sync: false keeps it out of PR previews
      - key: DATABASE_URL
        sync: false
      # Signs sessions and sign-in links; a different value in the preview-database group
      - key: BETTER_AUTH_SECRET
        sync: false
      # PREVIEW_DATABASE_URL (the Neon "preview" branch) and the previews' BETTER_AUTH_SECRET,
      # created in the dashboard as an environment group
      - fromGroup: preview-database
